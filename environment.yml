name: protein-cv
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - torchvision
  - torchaudio
  - cudatoolkit=11.7          # For GPU support; replace with 'cpuonly' for CPU-only installation
  - numpy=1.24.3
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - pandas=1.5.3
  - scikit-learn=1.2.2
  - openpyxl=3.1.2
  - pip
  - pip:
    - logomaker==0.8.1        # Used for generating sequence logos
    - tqdm                    # Optional, for progress bars (not used in the script but recommended)